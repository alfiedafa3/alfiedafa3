<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" style="background: linear-gradient(135deg, #080B14 0%, #0D1324 100%);">
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- Main card background -->
  <rect x="20" y="20" width="660" height="310" fill="#0D1324" stroke="#00F5FF" stroke-width="2" rx="4"/>
  <rect x="20" y="20" width="660" height="310" fill="url(#cardGradient)"/>
  
  <!-- Top border accent -->
  <line x1="20" y1="20" x2="680" y2="20" stroke="#8B5CF6" stroke-width="3" opacity="0.7"/>
  
  <!-- Project number and divider -->
  <text x="40" y="55" font-family="'Courier New', monospace" font-size="11" fill="#8993A4" letter-spacing="1">PROJECT 001</text>
  <line x1="40" y1="60" x2="660" y2="60" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Main title -->
  <text x="40" y="105" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#00F5FF" letter-spacing="2">TwoOfUs</text>
  
  <!-- Subtitle -->
  <text x="40" y="135" font-family="'Courier New', monospace" font-size="12" fill="#8993A4" letter-spacing="1">AI-POWERED RELATIONSHIP COMPANION</text>
  
  <!-- Description section -->
  <line x1="40" y1="145" x2="660" y2="145" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3"/>
  
  <text x="40" y="165" font-family="'Courier New', monospace" font-size="10" fill="#8993A4">Helps partners communicate through AI-assisted insights,</text>
  <text x="40" y="180" font-family="'Courier New', monospace" font-size="10" fill="#8993A4">context understanding, missions, and relationship reflection.</text>
  
  <!-- Status box -->
  <rect x="40" y="195" width="140" height="50" fill="#0D1324" stroke="#39FF88" stroke-width="1" opacity="0.6" rx="2"/>
  <text x="55" y="210" font-family="'Courier New', monospace" font-size="9" fill="#8993A4" letter-spacing="1">STATUS</text>
  <text x="55" y="227" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#39FF88">ACTIVE DEV</text>
  
  <!-- Stack box -->
  <rect x="200" y="195" width="420" height="50" fill="#0D1324" stroke="#8B5CF6" stroke-width="1" opacity="0.6" rx="2"/>
  <text x="215" y="210" font-family="'Courier New', monospace" font-size="9" fill="#8993A4" letter-spacing="1">STACK</text>
  <text x="215" y="227" font-family="'Courier New', monospace" font-size="10" fill="#E6F1FF">NEXT.JS • TYPESCRIPT • SUPABASE • AI</text>
  
  <!-- Type info -->
  <rect x="40" y="260" width="280" height="40" fill="#0D1324" stroke="#00F5FF" stroke-width="1" opacity="0.5" rx="2"/>
  <text x="55" y="273" font-family="'Courier New', monospace" font-size="9" fill="#8993A4">TYPE</text>
  <text x="55" y="290" font-family="'Courier New', monospace" font-size="10" fill="#00F5FF">PRIVATE AI APPLICATION</text>
  
  <!-- Repository button -->
  <rect x="340" y="260" width="280" height="40" fill="#0D1324" stroke="#00F5FF" stroke-width="2" rx="2" opacity="0.7"/>
  <text x="355" y="290" font-family="'Courier New', monospace" font-size="11" fill="#00F5FF" font-weight="bold">[ VIEW REPOSITORY ]</text>
  
  <!-- Corner accents -->
  <line x1="20" y1="20" x2="50" y2="20" stroke="#8B5CF6" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="20" x2="20" y2="50" stroke="#8B5CF6" stroke-width="1" opacity="0.6"/>
  
  <line x1="680" y1="20" x2="650" y2="20" stroke="#00F5FF" stroke-width="1" opacity="0.6"/>
  <line x1="680" y1="20" x2="680" y2="50" stroke="#00F5FF" stroke-width="1" opacity="0.6"/>
  
  <line x1="20" y1="330" x2="50" y2="330" stroke="#8B5CF6" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="300" x2="20" y2="330" stroke="#8B5CF6" stroke-width="1" opacity="0.6"/>
  
  <line x1="680" y1="330" x2="650" y2="330" stroke="#00F5FF" stroke-width="1" opacity="0.6"/>
  <line x1="680" y1="300" x2="680" y2="330" stroke="#00F5FF" stroke-width="1" opacity="0.6"/>
</svg>