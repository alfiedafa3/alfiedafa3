<svg width="100%" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
  <defs>
    <style>
      .dashboard-bg { fill: rgba(13, 17, 23, 0.8); stroke: #00d9ff; stroke-width: 1.5; }
      .dashboard-text { font-family: 'Courier New', monospace; fill: #c9d1d9; font-size: 12px; }
      .dashboard-label { fill: #888; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
      .dashboard-value { fill: #00d9ff; font-size: 12px; font-weight: 600; }
      .status-active { fill: #00d9ff; }
      .divider { stroke: rgba(0, 217, 255, 0.2); stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Main container -->
  <rect class="dashboard-bg" x="10" y="10" width="580" height="160" rx="4"/>
  
  <!-- Header -->
  <text class="dashboard-label" x="25" y="30">SECURITY &amp; DEV STATUS</text>
  <line class="divider" x1="25" y1="35" x2="575" y2="35"/>
  
  <!-- Column 1: Status & Focus -->
  <text class="dashboard-label" x="25" y="55">STATUS</text>
  <circle class="status-active" cx="31" cy="68" r="2.5"/>
  <text class="dashboard-text" x="40" y="71">ACTIVE</text>
  
  <text class="dashboard-label" x="25" y="95">CURRENT FOCUS</text>
  <text class="dashboard-value" x="40" y="110">Cybersecurity Fundamentals</text>
  
  <!-- Column 2: Building & Learning -->
  <text class="dashboard-label" x="200" y="55">BUILDING</text>
  <text class="dashboard-value" x="215" y="71">TwoOfUs</text>
  
  <text class="dashboard-label" x="200" y="95">LEARNING</text>
  <text class="dashboard-text" x="215" y="110">Web Security • Linux • Networking</text>
  
  <!-- Column 3: Exploring & Next -->
  <text class="dashboard-label" x="400" y="55">EXPLORING</text>
  <text class="dashboard-text" x="415" y="71">Defensive Security • Automation</text>
  
  <text class="dashboard-label" x="400" y="95">NEXT MISSION</text>
  <text class="dashboard-value" x="415" y="110">Personal Security Lab</text>
  
  <!-- Bottom accent line -->
  <line class="divider" x1="25" y1="135" x2="575" y2="135"/>
  <line x1="25" y1="136" x2="575" y2="136" stroke="#00d9ff" stroke-width="0.5" opacity="0.3"/>
</svg>