<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="symbioteGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1744;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#050505;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FF1744;stop-opacity:0.15"/>
    </linearGradient>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="#050505"/>
  <rect width="1200" height="300" fill="url(#symbioteGlow)"/>
  
  <!-- Abstract symbiote/web pattern - top left -->
  <path d="M 0 0 Q 50 30 100 20 T 200 40" stroke="#FF1744" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 0 10 Q 60 40 120 35 T 240 50" stroke="#FF1744" stroke-width="0.5" fill="none" opacity="0.25"/>
  <circle cx="80" cy="35" r="2" fill="#FF1744" opacity="0.5"/>
  <circle cx="150" cy="42" r="1.5" fill="#FF1744" opacity="0.4"/>
  
  <!-- Web pattern - top right -->
  <path d="M 1200 0 Q 1150 25 1100 20 T 1000 35" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 1200 15 Q 1140 45 1080 40 T 960 55" stroke="#00E5FF" stroke-width="0.5" fill="none" opacity="0.2"/>
  <circle cx="1100" cy="30" r="1.5" fill="#00E5FF" opacity="0.4"/>
  
  <!-- Glitch effect lines -->
  <line x1="200" y1="0" x2="198" y2="80" stroke="#FF1744" stroke-width="0.5" opacity="0.3"/>
  <line x1="1000" y1="0" x2="1002" y2="70" stroke="#00E5FF" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Main text -->
  <text x="600" y="100" font-family="'Courier New', monospace" font-size="58" font-weight="bold" fill="#E8E8E8" text-anchor="middle" filter="url(#redGlow)" letter-spacing="2">
    DAFFA ALFIE
  </text>
  
  <!-- Subtitle with accent -->
  <text x="600" y="150" font-family="'Courier New', monospace" font-size="16" fill="#00E5FF" text-anchor="middle" letter-spacing="2">
    SECURITY // SOFTWARE // AI
  </text>
  
  <!-- Identity line -->
  <text x="600" y="190" font-family="'Courier New', monospace" font-size="13" fill="#8B5CF6" text-anchor="middle" letter-spacing="1">
    DAFFA // SECURITY & SOFTWARE LAB
  </text>
  
  <!-- Bottom accent lines -->
  <line x1="300" y1="220" x2="900" y2="220" stroke="#FF1744" stroke-width="1" opacity="0.4"/>
  <circle cx="300" cy="220" r="2" fill="#FF1744" opacity="0.6"/>
  <circle cx="600" cy="220" r="2.5" fill="#FF1744" opacity="0.7"/>
  <circle cx="900" cy="220" r="2" fill="#FF1744" opacity="0.6"/>
  
  <!-- Bottom web pattern -->
  <path d="M 100 250 Q 150 270 200 260 T 300 280" stroke="#FF1744" stroke-width="0.5" fill="none" opacity="0.25"/>
  <path d="M 1100 250 Q 1050 270 1000 260 T 900 280" stroke="#00E5FF" stroke-width="0.5" fill="none" opacity="0.2"/>
  
  <!-- HUD corner accents -->
  <line x1="50" y1="250" x2="50" y2="290" stroke="#FF1744" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="290" x2="100" y2="290" stroke="#FF1744" stroke-width="1.5" opacity="0.5"/>
  
  <line x1="1150" y1="250" x2="1150" y2="290" stroke="#00E5FF" stroke-width="1.5" opacity="0.4"/>
  <line x1="1100" y1="290" x2="1150" y2="290" stroke="#00E5FF" stroke-width="1.5" opacity="0.4"/>
</svg>