  <text x="25" y="125" font-family="'Courier New', monospace" font-size="10" fill="#8993A4" letter-spacing="1">CURRENT TRACK</text>
  <text x="25" y="145" font-family="'Courier New', monospace" font-size="13" fill="#00F5FF" font-weight="bold">CYBERSECURITY</text>
  
  <text x="25" y="185" font-family="'Courier New', monospace" font-size="10" fill="#8993A4" letter-spacing="1">FOCUS AREA</text>
  <text x="25" y="205" font-family="'Courier New', monospace" font-size="12" fill="#00F5FF">Fundamentals</text>
  
  <!-- Column 2: Building & Learning -->
