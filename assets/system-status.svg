<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" style="background: linear-gradient(to bottom, #080B14 0%, #0D1324 50%, #080B14 100%);">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Main panel background -->
  <rect x="10" y="10" width="880" height="260" fill="#0D1324" stroke="#00F5FF" stroke-width="1.5" opacity="0.7"/>
  <rect x="10" y="10" width="880" height="260" fill="url(#panelGrad)"/>
  
  <!-- Header section -->
  <line x1="10" y1="40" x2="890" y2="40" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <text x="25" y="32" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#8993A4" letter-spacing="2">SYSTEM STATUS 2026</text>
  
  <!-- Column separators -->
