  <line x1="670" y1="40" x2="670" y2="270" stroke="#00F5FF" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Column 1: Status & Current Track -->
  <text x="25" y="65" font-family="'Courier New', monospace" font-size="10" fill="#8993A4" letter-spacing="1">STATUS</text>
