  <text x="710" y="140" font-family="'Courier New', monospace" font-size="9" fill="#8B5CF6">02 LEARNING</text>
  
  <circle cx="685" cy="170" r="3" fill="#8B5CF6" opacity="0.6"/>
  <text x="710" y="175" font-family="'Courier New', monospace" font-size="9" fill="#8B5CF6">03 LEARNING</text>
  
  <!-- Next point -->
  <circle cx="685" cy="205" r="3" fill="#8993A4" opacity="0.5"/>
  <text x="710" y="210" font-family="'Courier New', monospace" font-size="9" fill="#8993A4">04 NEXT</text>
  
  <!-- Bottom accent line -->
  <line x1="10" y1="265" x2="890" y2="265" stroke="#00F5FF" stroke-width="1" opacity="0.4"/>
