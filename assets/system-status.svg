  <text x="245" y="105" font-family="'Courier New', monospace" font-size="9" fill="#8993A4">AI Companion</text>
  
  <text x="245" y="145" font-family="'Courier New', monospace" font-size="10" fill="#8993A4" letter-spacing="1">LEARNING</text>
  <text x="245" y="165" font-family="'Courier New', monospace" font-size="11" fill="#E6F1FF">Web Security</text>
  <text x="245" y="180" font-family="'Courier New', monospace" font-size="11" fill="#E6F1FF">Linux • Networking</text>
  <text x="245" y="195" font-family="'Courier New', monospace" font-size="11" fill="#E6F1FF">Backend Eng</text>
  
  <!-- Column 3: Exploring & Next -->
  <text x="465" y="65" font-family="'Courier New', monospace" font-size="10" fill="#8993A4" letter-spacing="1">EXPLORING</text>
  <text x="465" y="85" font-family="'Courier New', monospace" font-size="11" fill="#E6F1FF">Defensive Sec</text>
  <text x="465" y="100" font-family="'Courier New', monospace" font-size="11" fill="#E6F1FF">Security Auto</text>
  <text x="465" y="115" font-family="'Courier New', monospace" font-size="11" fill="#E6F1FF">AI Engineering</text>
  
  <text x="465" y="155" font-family="'Courier New', monospace" font-size="10" fill="#8993A4" letter-spacing="1">NEXT OBJECTIVE</text>
