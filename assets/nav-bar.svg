  <!-- LAB -->
  <rect x="395" y="12" width="85" height="35" fill="#0D1324" stroke="#8B5CF6" stroke-width="1" rx="2" opacity="0.7"/>
  <text x="418" y="35" font-family="'Courier New', monospace" font-size="11" fill="#8B5CF6">[ LAB ]</text>
  
  <!-- LOG -->
  <rect x="490" y="12" width="85" height="35" fill="#0D1324" stroke="#8B5CF6" stroke-width="1" rx="2" opacity="0.7"/>
  <text x="512" y="35" font-family="'Courier New', monospace" font-size="11" fill="#8B5CF6">[ LOG ]</text>
  
