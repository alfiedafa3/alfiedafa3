<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" style="background: linear-gradient(to bottom, #080B14 0%, #0D1324 100%);">
  <defs>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main border -->
  <rect x="20" y="20" width="960" height="610" fill="#0D1324" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Header -->
  <text x="40" y="50" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#8993A4" letter-spacing="2">03 // SECURITY ROADMAP</text>
  <line x="20" y="60" x2="980" y2="60" stroke="#8B5CF6" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Central vertical line -->
  <line x1="500" y1="90" x2="500" y2="600" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4"/>
  
  <!-- NODE 01: Cybersecurity Fundamentals (CURRENT) -->
  <g filter="url(#nodeGlow)">
    <rect x="320" y="90" width="360" height="90" fill="#0D1324" stroke="#00F5FF" stroke-width="2" rx="3"/>
    <circle cx="500" cy="135" r="8" fill="#00F5FF"/>
  </g>
  <text x="350" y="115" font-family="'Courier New', monospace" font-size="11" fill="#8B5CF6" letter-spacing="1">[01]</text>
  <text x="350" y="135" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00F5FF">CYBERSECURITY</text>
  <text x="350" y="152" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00F5FF">FUNDAMENTALS</text>
  <text x="670" y="135" font-family="'Courier New', monospace" font-size="11" fill="#39FF88" font-weight="bold">● CURRENT</text>
  
  <!-- Arrow down -->
  <path d="M 500 180 L 500 210" stroke="#8B5CF6" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <polygon points="500,210 495,200 505,200" fill="#8B5CF6" opacity="0.6"/>
  
  <!-- NODE 02: Linux Fundamentals (LEARNING) -->
  <g filter="url(#nodeGlow)">
    <rect x="320" y="215" width="360" height="90" fill="#0D1324" stroke="#8B5CF6" stroke-width="2" rx="3"/>
    <circle cx="500" cy="260" r="7" fill="#8B5CF6" opacity="0.8"/>
  </g>
  <text x="350" y="240" font-family="'Courier New', monospace" font-size="11" fill="#8B5CF6" letter-spacing="1">[02]</text>
  <text x="350" y="260" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#8B5CF6">LINUX</text>
  <text x="350" y="277" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#8B5CF6">SECURITY</text>
  <text x="690" y="260" font-family="'Courier New', monospace" font-size="10" fill="#8B5CF6">● LEARNING</text>
  
  <!-- Split path -->
  <path d="M 500 305 L 500 330" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
  <path d="M 500 330 L 300 330 L 300 360" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
  <path d="M 500 330 L 700 330 L 700 360" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
  
  <!-- NODE 03A: Networking (LEFT - LEARNING) -->
  <g filter="url(#nodeGlow)">
    <rect x="150" y="360" width="300" height="80" fill="#0D1324" stroke="#8B5CF6" stroke-width="1.5" rx="3"/>
    <circle cx="300" cy="400" r="6" fill="#8B5CF6" opacity="0.7"/>
  </g>
  <text x="175" y="385" font-family="'Courier New', monospace" font-size="10" fill="#8B5CF6">[03]</text>
  <text x="175" y="405" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#8B5CF6">NETWORKING</text>
  <text x="175" y="420" font-family="'Courier New', monospace" font-size="9" fill="#8993A4">● LEARNING</text>
  
  <!-- NODE 03B: Web Security (RIGHT - LEARNING) -->
  <g filter="url(#nodeGlow)">
    <rect x="550" y="360" width="300" height="80" fill="#0D1324" stroke="#8B5CF6" stroke-width="1.5" rx="3"/>
    <circle cx="700" cy="400" r="6" fill="#8B5CF6" opacity="0.7"/>
  </g>
  <text x="575" y="385" font-family="'Courier New', monospace" font-size="10" fill="#8B5CF6">[04]</text>
  <text x="575" y="405" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#8B5CF6">WEB SECURITY</text>
  <text x="575" y="420" font-family="'Courier New', monospace" font-size="9" fill="#8993A4">● LEARNING</text>
  
  <!-- Convergence lines -->
  <path d="M 300 440 L 300 470 L 500 470 L 700 470 L 700 440" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
  <polygon points="500,470 495,460 505,460" fill="#8B5CF6" opacity="0.6"/>
  
  <!-- NODE 04: Defensive Security (NEXT) -->
  <g filter="url(#nodeGlow)">
    <rect x="320" y="470" width="360" height="90" fill="#0D1324" stroke="#8B5CF6" stroke-width="1.5" rx="3" opacity="0.9"/>
    <circle cx="500" cy="515" r="6" fill="#8B5CF6" opacity="0.6"/>
  </g>
  <text x="350" y="495" font-family="'Courier New', monospace" font-size="11" fill="#8B5CF6">[05]</text>
  <text x="350" y="515" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#8B5CF6">DEFENSIVE</text>
  <text x="350" y="532" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#8B5CF6">SECURITY</text>
  <text x="690" y="515" font-family="'Courier New', monospace" font-size="10" fill="#8993A4">● NEXT</text>
  
  <!-- Arrow down -->
  <path d="M 500 560 L 500 590" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
  <polygon points="500,590 495,580 505,580" fill="#8B5CF6" opacity="0.6"/>
  
  <!-- NODE 05: Security Lab (PLANNED) -->
  <g filter="url(#nodeGlow)">
    <rect x="320" y="590" width="360" height="90" fill="#0D1324" stroke="#8993A4" stroke-width="1.5" rx="3" opacity="0.7"/>
    <circle cx="500" cy="635" r="5" fill="#8993A4" opacity="0.5"/>
  </g>
  <text x="350" y="615" font-family="'Courier New', monospace" font-size="11" fill="#8993A4">[06]</text>
  <text x="350" y="635" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#8993A4">PERSONAL</text>
  <text x="350" y="652" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#8993A4">SECURITY LAB</text>
  <text x="690" y="635" font-family="'Courier New', monospace" font-size="10" fill="#8993A4">● PLANNED</text>
  
  <!-- Legend -->
  <circle cx="50" cy="100" r="3" fill="#00F5FF"/>
  <text x="65" y="104" font-family="'Courier New', monospace" font-size="9" fill="#8993A4">Current</text>
  
  <circle cx="50" cy="125" r="3" fill="#8B5CF6"/>
  <text x="65" y="129" font-family="'Courier New', monospace" font-size="9" fill="#8993A4">Learning</text>
  
  <circle cx="50" cy="150" r="2.5" fill="#8993A4" opacity="0.5"/>
  <text x="65" y="154" font-family="'Courier New', monospace" font-size="9" fill="#8993A4">Planned</text>
</svg>