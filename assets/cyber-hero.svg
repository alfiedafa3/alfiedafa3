<svg viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg" style="background: linear-gradient(135deg, #080B14 0%, #0D1324 50%, #080B14 100%);">
  <defs>
    <linearGradient id="heroGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00F5FF;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <rect width="1200" height="350" fill="url(#heroGlow)"/>
  
  <!-- Top border line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
  
  <!-- Corner brackets - top left -->
  <line x1="15" y1="15" x2="50" y2="15" stroke="#8B5CF6" stroke-width="1.5" opacity="0.8"/>
  <line x1="15" y1="15" x2="15" y2="50" stroke="#8B5CF6" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Corner brackets - top right -->
  <line x1="1185" y1="15" x2="1150" y2="15" stroke="#00F5FF" stroke-width="1.5" opacity="0.8"/>
  <line x1="1185" y1="15" x2="1185" y2="50" stroke="#00F5FF" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Decorative grid lines -->
  <line x1="80" y1="25" x2="120" y2="25" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3"/>
  <line x1="80" y1="30" x2="120" y2="30" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Main title - DAFFA ALFIE -->
  <text x="100" y="90" font-family="'Courier New', monospace" font-size="72" font-weight="bold" fill="#00F5FF" filter="url(#glow)" letter-spacing="4">DAFFA</text>
  <text x="100" y="160" font-family="'Courier New', monospace" font-size="72" font-weight="bold" fill="#00F5FF" filter="url(#glow)" letter-spacing="4">ALFIE</text>
  
  <!-- Secondary text - right side -->
  <text x="750" y="80" font-family="'Courier New', monospace" font-size="11" fill="#8993A4" letter-spacing="2" opacity="0.8">SECURITY // SOFTWARE // AI</text>
  
  <!-- Status boxes - top right -->
  <rect x="750" y="105" width="180" height="45" fill="#0D1324" stroke="#00F5FF" stroke-width="1" opacity="0.5"/>
  <text x="765" y="120" font-family="'Courier New', monospace" font-size="9" fill="#8993A4" letter-spacing="1">[ STATUS ]</text>
  <text x="765" y="135" font-family="'Courier New', monospace" font-size="12" fill="#39FF88" font-weight="bold">● ONLINE</text>
  <circle cx="755" cy="132" r="3" fill="#39FF88"/>
  
  <rect x="950" y="105" width="200" height="45" fill="#0D1324" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <text x="965" y="120" font-family="'Courier New', monospace" font-size="9" fill="#8993A4" letter-spacing="1">[ TRACK ]</text>
  <text x="965" y="135" font-family="'Courier New', monospace" font-size="12" fill="#00F5FF" font-weight="bold">CYBERSECURITY</text>
  
  <!-- HUD info boxes - bottom -->
  <rect x="750" y="160" width="180" height="45" fill="#0D1324" stroke="#00F5FF" stroke-width="1" opacity="0.5"/>
  <text x="765" y="175" font-family="'Courier New', monospace" font-size="9" fill="#8993A4" letter-spacing="1">[ BUILDING ]</text>
  <text x="765" y="190" font-family="'Courier New', monospace" font-size="12" fill="#00F5FF" font-weight="bold">TwoOfUs</text>
  
  <rect x="950" y="160" width="200" height="45" fill="#0D1324" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <text x="965" y="175" font-family="'Courier New', monospace" font-size="9" fill="#8993A4" letter-spacing="1">[ ID ]</text>
  <text x="965" y="190" font-family="'Courier New', monospace" font-size="12" fill="#8B5CF6" font-weight="bold">alfiedafa3</text>
  
  <!-- Bottom identity -->
  <text x="100" y="260" font-family="'Courier New', monospace" font-size="13" fill="#8993A4" letter-spacing="2">DAFFA // SECURITY & SOFTWARE LAB</text>
  
  <!-- Bottom divider with nodes -->
  <line x1="100" y1="280" x2="1100" y2="280" stroke="#8B5CF6" stroke-width="0.5" opacity="0.4"/>
  <circle cx="100" cy="280" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="600" cy="280" r="2" fill="#00F5FF" opacity="0.4"/>
  <circle cx="1100" cy="280" r="3" fill="#00F5FF" opacity="0.6"/>
  
  <!-- Decorative circuit trace -->
  <path d="M 100 290 L 150 290 L 150 310 L 200 310" stroke="#00F5FF" stroke-width="0.5" fill="none" opacity="0.3"/>
  
  <!-- Bottom corner brackets - left -->
  <line x1="15" y1="335" x2="50" y2="335" stroke="#8B5CF6" stroke-width="1.5" opacity="0.8"/>
  <line x1="15" y1="300" x2="15" y2="335" stroke="#8B5CF6" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Bottom corner brackets - right -->
  <line x1="1185" y1="335" x2="1150" y2="335" stroke="#00F5FF" stroke-width="1.5" opacity="0.8"/>
  <line x1="1185" y1="300" x2="1185" y2="335" stroke="#00F5FF" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Bottom border -->
  <line x1="0" y1="350" x2="1200" y2="350" stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
</svg>